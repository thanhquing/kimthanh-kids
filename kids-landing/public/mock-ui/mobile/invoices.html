<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Học phí — KimThanh Kids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/mock-ui/shared.css" />
    <script src="/mock-ui/shared.js" defer></script>
  </head>
  <body class="min-h-screen">
    <div class="fixed top-4 left-4 z-50">
      <a href="/mock-ui/index.html" class="btn-soft inline-flex items-center gap-2 text-sm shadow"
        ><i data-lucide="arrow-left" class="w-4 h-4"></i>Catalog</a
      >
    </div>
    <main class="min-h-screen flex flex-col items-center justify-start py-10 px-4 bg-[#F1F5F9]">
      <div class="frame-label"><span class="num">M13</span>Học phí</div>
      <div class="phone">
        <div class="phone-body">
          <div
            class="absolute top-0 left-0 right-0 pt-9 pb-3 px-5 flex items-center justify-between bg-white border-b border-slate-100 z-10"
          >
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
            <div class="font-semibold text-slate-800">Học phí</div>
            <div class="w-5"></div>
          </div>
          <div class="h-14"></div>
          <div class="flex gap-2 mb-3">
            <span class="chip active">Chưa thanh toán (2)</span
            ><span class="chip">Đã thanh toán</span><span class="chip">Tất cả</span>
          </div>
          <div class="space-y-3">
            <div class="card p-4">
              <div class="flex items-center justify-between mb-1">
                <div class="font-semibold">Học phí Tháng 5/2026</div>
                <span class="badge b-amber">Chưa thanh toán</span>
              </div>
              <div class="text-xs text-slate-500">Bé Minh</div>
              <div class="text-2xl font-bold mt-2 text-slate-800">1.500.000 ₫</div>
              <div class="text-xs text-slate-500 mt-1">
                <i data-lucide="calendar" class="w-3 h-3 inline"></i> Hạn: 31/05/2026
              </div>
              <button class="btn-soft w-full mt-3 text-sm">Liên hệ trường để thanh toán</button>
            </div>
            <div class="card p-4">
              <div class="flex items-center justify-between mb-1">
                <div class="font-semibold">Học phí Tháng 5/2026</div>
                <span class="badge b-red">Quá hạn</span>
              </div>
              <div class="text-xs text-slate-500">Bé An</div>
              <div class="text-2xl font-bold mt-2 text-slate-800">1.500.000 ₫</div>
              <div class="text-xs text-slate-500 mt-1">
                <i data-lucide="calendar" class="w-3 h-3 inline"></i> Hạn: 31/05/2026
              </div>
              <button class="btn-soft w-full mt-3 text-sm">Liên hệ trường để thanh toán</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
