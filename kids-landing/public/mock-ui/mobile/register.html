<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Đăng ký phụ huynh — KimThanh Kids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/mock-ui/shared.css" />
    <script src="/mock-ui/shared.js" defer></script>
  </head>
  <body class="min-h-screen">
    <div class="fixed top-4 left-4 z-50">
      <a href="/mock-ui/index.html" class="btn-soft inline-flex items-center gap-2 text-sm shadow"
        ><i data-lucide="arrow-left" class="w-4 h-4"></i>Catalog</a
      >
    </div>
    <main class="min-h-screen flex flex-col items-center justify-start py-10 px-4 bg-[#F1F5F9]">
      <div class="frame-label"><span class="num">M2</span>Đăng ký phụ huynh</div>
      <div class="phone">
        <div class="phone-body">
          <div
            class="absolute top-0 left-0 right-0 pt-9 pb-3 px-5 flex items-center justify-between bg-white border-b border-slate-100 z-10"
          >
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
            <div class="font-semibold text-slate-800">Đăng ký</div>
            <div class="w-5"></div>
          </div>
          <div class="h-14"></div>
          <form class="space-y-4">
            <div>
              <label class="label">Họ và tên</label><input class="field" value="Nguyễn Thị Lan" />
            </div>
            <div>
              <label class="label">Email</label><input class="field" value="lan.nguyen@gmail.com" />
            </div>
            <div>
              <label class="label">Số điện thoại</label
              ><input class="field" placeholder="(tuỳ chọn)" value="0912 345 678" />
            </div>
            <div>
              <label class="label">Mật khẩu</label
              ><input class="field" type="password" value="••••••••" />
              <div class="mt-2 flex gap-1">
                <span class="h-1 flex-1 bg-[color:var(--success)] rounded"></span
                ><span class="h-1 flex-1 bg-[color:var(--success)] rounded"></span
                ><span class="h-1 flex-1 bg-[color:var(--success)] rounded"></span
                ><span class="h-1 flex-1 bg-slate-200 rounded"></span>
              </div>
              <div class="text-xs text-slate-500 mt-1">Mạnh — gồm chữ hoa, chữ thường và số</div>
            </div>
            <div>
              <label class="label">Xác nhận mật khẩu</label
              ><input class="field" type="password" value="••••••••" />
            </div>
            <button
              type="button"
              onclick="toast('Tạo tài khoản thành công')"
              class="btn-primary w-full mt-2"
            >
              Tạo tài khoản
            </button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
