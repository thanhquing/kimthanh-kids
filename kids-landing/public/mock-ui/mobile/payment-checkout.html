<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Thanh toán học phí — KimThanh Kids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/mock-ui/shared.css" />
    <script src="/mock-ui/shared.js" defer></script>
  </head>
  <body class="min-h-screen">
    <div class="fixed top-4 left-4 z-50">
      <a href="/mock-ui/index.html" class="btn-soft inline-flex items-center gap-2 text-sm shadow"
        ><i data-lucide="arrow-left" class="w-4 h-4"></i>Catalog</a
      >
    </div>
    <main class="min-h-screen flex flex-col items-center justify-start py-10 px-4 bg-[#F1F5F9]">
      <div class="frame-label"><span class="num">P13</span>Thanh toán</div>
      <div class="phone">
        <div class="phone-body">
          <div
            class="absolute top-0 left-0 right-0 pt-9 pb-3 px-5 flex items-center justify-between bg-white border-b border-slate-100 z-10"
          >
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
            <div class="font-semibold text-slate-800">Thanh toán học phí</div>
            <div class="w-5"></div>
          </div>
          <div class="h-14"></div>
          <div class="card p-4 brand-grad text-white">
            <div class="text-xs opacity-80">Hóa đơn tháng 05/2026 · Bé Nguyễn Minh</div>
            <div class="text-2xl font-bold mt-1">1.850.000 ₫</div>
            <div class="text-xs opacity-80 mt-1">Hạn thanh toán: 30/05/2026</div>
          </div>
          <div class="section-title">Chi tiết khoản thu</div>
          <div class="card divide-y divide-slate-100">
            <div class="flex justify-between p-3 text-sm">
              <span>Học phí cơ bản</span><b>1.200.000 ₫</b>
            </div>
            <div class="flex justify-between p-3 text-sm">
              <span>Tiền ăn (22 ngày)</span><b>550.000 ₫</b>
            </div>
            <div class="flex justify-between p-3 text-sm">
              <span>Học liệu</span><b>100.000 ₫</b>
            </div>
          </div>
          <div class="section-title">Phương thức thanh toán</div>
          <div class="space-y-2">
            <label class="card p-3 flex items-center gap-3 cursor-pointer"
              ><input type="radio" name="pm" checked class="accent-[color:var(--primary)]" /><i
                data-lucide="credit-card"
                class="w-5 h-5 text-[color:var(--primary)]"
              ></i>
              <div class="flex-1">
                <div class="font-semibold text-sm">VNPay QR</div>
                <div class="text-xs text-slate-500">Miễn phí giao dịch</div>
              </div></label
            >
            <label class="card p-3 flex items-center gap-3 cursor-pointer"
              ><input type="radio" name="pm" class="accent-[color:var(--primary)]" /><i
                data-lucide="qr-code"
                class="w-5 h-5 text-slate-500"
              ></i>
              <div class="flex-1">
                <div class="font-semibold text-sm">Chuyển khoản VietQR</div>
                <div class="text-xs text-slate-500">Quét mã bằng app ngân hàng · miễn phí</div>
              </div></label
            >
            <label class="card p-3 flex items-center gap-3 cursor-pointer"
              ><input type="radio" name="pm" class="accent-[color:var(--primary)]" /><i
                data-lucide="banknote"
                class="w-5 h-5 text-slate-500"
              ></i>
              <div class="flex-1">
                <div class="font-semibold text-sm">Tiền mặt tại trường</div>
                <div class="text-xs text-slate-500">Nộp trực tiếp, kế toán xác nhận</div>
              </div></label
            >
          </div>
          <button onclick="toast('Đã chuyển sang cổng thanh toán')" class="btn-primary w-full mt-5">
            Thanh toán 1.850.000 ₫
          </button>
        </div>
        <div class="phone-tabbar">
          <div class="tab"><i data-lucide="home" class="w-5 h-5"></i><span>Trang chủ</span></div>
          <div class="tab"><i data-lucide="users" class="w-5 h-5"></i><span>Con tôi</span></div>
          <div class="tab active">
            <i data-lucide="message-circle" class="w-5 h-5"></i><span>Tin nhắn</span>
          </div>
          <div class="tab"><i data-lucide="user" class="w-5 h-5"></i><span>Hồ sơ</span></div>
        </div>
      </div>
    </main>
  </body>
</html>
