<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Danh sách con — KimThanh Kids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/mock-ui/shared.css" />
    <script src="/mock-ui/shared.js" defer></script>
  </head>
  <body class="min-h-screen">
    <div class="fixed top-4 left-4 z-50">
      <a href="/mock-ui/index.html" class="btn-soft inline-flex items-center gap-2 text-sm shadow"
        ><i data-lucide="arrow-left" class="w-4 h-4"></i>Catalog</a
      >
    </div>
    <main class="min-h-screen flex flex-col items-center justify-start py-10 px-4 bg-[#F1F5F9]">
      <div class="frame-label"><span class="num">M4</span>Danh sách con</div>
      <div class="phone">
        <div class="phone-body">
          <div
            class="absolute top-0 left-0 right-0 pt-9 pb-3 px-5 flex items-center justify-between bg-white border-b border-slate-100 z-10"
          >
            <div class="w-5"></div>
            <div class="font-semibold text-slate-800">Con của tôi</div>
            <i data-lucide="search" class="w-5 h-5"></i>
          </div>
          <div class="h-14"></div>
          <div class="space-y-3">
            <div class="card p-3 flex items-center gap-3">
              <div class="avatar !w-12 !h-12 bg-gradient-to-br from-pink-300 to-orange-300">N</div>
              <div class="flex-1">
                <div class="font-semibold">Nguyễn Minh</div>
                <div class="text-xs text-slate-500">Lớp Mầm A · 4 tuổi</div>
              </div>
              <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i>
            </div>
            <div class="card p-3 flex items-center gap-3">
              <div class="avatar !w-12 !h-12 bg-gradient-to-br from-blue-300 to-emerald-300">N</div>
              <div class="flex-1">
                <div class="font-semibold">Nguyễn An</div>
                <div class="text-xs text-slate-500">Lớp Chồi B · 5 tuổi</div>
              </div>
              <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i>
            </div>
            <div class="card p-3 flex items-center gap-3">
              <div class="avatar !w-12 !h-12 bg-gradient-to-br from-purple-300 to-pink-300">L</div>
              <div class="flex-1">
                <div class="font-semibold">Lê Bảo Châu</div>
                <div class="text-xs text-slate-500">Lớp Lá C · 6 tuổi</div>
              </div>
              <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i>
            </div>
          </div>
        </div>
        <div class="phone-tabbar">
          <div class="tab active">
            <i data-lucide="home" class="w-5 h-5"></i><span>Trang chủ</span>
          </div>
          <div class="tab"><i data-lucide="users" class="w-5 h-5"></i><span>Con tôi</span></div>
          <div class="tab"><i data-lucide="bell" class="w-5 h-5"></i><span>Thông báo</span></div>
          <div class="tab"><i data-lucide="user" class="w-5 h-5"></i><span>Hồ sơ</span></div>
        </div>
      </div>
    </main>
  </body>
</html>
