<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Yêu cầu thuốc — Tạo — KimThanh Kids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/mock-ui/shared.css" />
    <script src="/mock-ui/shared.js" defer></script>
  </head>
  <body class="min-h-screen">
    <div class="fixed top-4 left-4 z-50">
      <a href="/mock-ui/index.html" class="btn-soft inline-flex items-center gap-2 text-sm shadow"
        ><i data-lucide="arrow-left" class="w-4 h-4"></i>Catalog</a
      >
    </div>
    <main class="min-h-screen flex flex-col items-center justify-start py-10 px-4 bg-[#F1F5F9]">
      <div class="frame-label"><span class="num">M11</span>Yêu cầu thuốc — Tạo</div>
      <div class="phone">
        <div class="phone-body">
          <div
            class="absolute top-0 left-0 right-0 pt-9 pb-3 px-5 flex items-center justify-between bg-white border-b border-slate-100 z-10"
          >
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
            <div class="font-semibold text-slate-800">Tạo yêu cầu thuốc</div>
            <div class="w-5"></div>
          </div>
          <div class="h-14"></div>
          <form class="space-y-4">
            <div>
              <label class="label">Chọn con</label
              ><select class="field">
                <option>Nguyễn Minh — Lớp Mầm A</option>
                <option>Nguyễn An — Lớp Chồi B</option>
              </select>
            </div>
            <div>
              <label class="label">Tên thuốc</label><input class="field" value="Siro ho Prospan" />
            </div>
            <div>
              <label class="label">Liều dùng</label><input class="field" value="5ml mỗi lần" />
            </div>
            <div>
              <label class="label">Lịch uống</label
              ><input class="field" value="8h sáng và 14h chiều" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="label">Từ ngày</label
                ><input class="field" type="date" value="2026-05-26" />
              </div>
              <div>
                <label class="label">Đến ngày</label
                ><input class="field" type="date" value="2026-05-29" />
              </div>
            </div>
            <div>
              <label class="label">Lý do</label
              ><textarea class="field" rows="3">
Bé bị ho, cần uống thuốc theo chỉ định bác sĩ.</textarea
              >
            </div>
            <button
              type="button"
              onclick="toast('Đã gửi yêu cầu cho y tá')"
              class="btn-primary w-full"
            >
              Gửi yêu cầu
            </button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
