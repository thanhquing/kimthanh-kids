<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Điểm danh — KimThanh Kids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/mock-ui/shared.css" />
    <script src="/mock-ui/shared.js" defer></script>
  </head>
  <body class="min-h-screen">
    <div class="fixed top-4 left-4 z-50">
      <a href="/mock-ui/index.html" class="btn-soft inline-flex items-center gap-2 text-sm shadow"
        ><i data-lucide="arrow-left" class="w-4 h-4"></i>Catalog</a
      >
    </div>
    <main class="min-h-screen flex flex-col items-center justify-start py-10 px-4 bg-[#F1F5F9]">
      <div class="frame-label"><span class="num">M6</span>Điểm danh</div>
      <div class="phone">
        <div class="phone-body">
          <div
            class="absolute top-0 left-0 right-0 pt-9 pb-3 px-5 flex items-center justify-between bg-white border-b border-slate-100 z-10"
          >
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
            <div class="font-semibold text-slate-800">Điểm danh · Lớp Mầm A</div>
            <div class="w-5"></div>
          </div>
          <div class="h-14"></div>
          <div class="card p-3 flex items-center justify-between mb-3">
            <div class="text-sm">
              <i data-lucide="calendar" class="w-4 h-4 inline mr-1"></i> Thứ Ba, 26/05/2026
            </div>
            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
          </div>
          <div class="space-y-2">
            <div class="card p-3">
              <div class="flex items-center gap-2 mb-2">
                <div class="avatar !w-9 !h-9 text-xs bg-gradient-to-br from-pink-300 to-pink-300">
                  N
                </div>
                <div class="flex-1 text-sm font-semibold">Nguyễn Minh</div>
                <i data-lucide="message-square" class="w-4 h-4 text-slate-400"></i>
              </div>
              <div class="grid grid-cols-4 gap-1">
                <button class="chip active !text-xs !py-1">Có mặt</button>
                <button class="chip !text-xs !py-1">Muộn</button>
                <button class="chip !text-xs !py-1">Vắng</button>
                <button class="chip !text-xs !py-1">Phép</button>
              </div>
            </div>
            <div class="card p-3">
              <div class="flex items-center gap-2 mb-2">
                <div class="avatar !w-9 !h-9 text-xs bg-gradient-to-br from-blue-300 to-pink-300">
                  T
                </div>
                <div class="flex-1 text-sm font-semibold">Trần Hùng</div>
                <i data-lucide="message-square" class="w-4 h-4 text-slate-400"></i>
              </div>
              <div class="grid grid-cols-4 gap-1">
                <button class="chip active !text-xs !py-1">Có mặt</button>
                <button class="chip !text-xs !py-1">Muộn</button>
                <button class="chip !text-xs !py-1">Vắng</button>
                <button class="chip !text-xs !py-1">Phép</button>
              </div>
            </div>
            <div class="card p-3">
              <div class="flex items-center gap-2 mb-2">
                <div class="avatar !w-9 !h-9 text-xs bg-gradient-to-br from-purple-300 to-pink-300">
                  L
                </div>
                <div class="flex-1 text-sm font-semibold">Lê Mai</div>
                <i data-lucide="message-square" class="w-4 h-4 text-slate-400"></i>
              </div>
              <div class="grid grid-cols-4 gap-1">
                <button class="chip !text-xs !py-1">Có mặt</button>
                <button class="chip active !text-xs !py-1">Muộn</button>
                <button class="chip !text-xs !py-1">Vắng</button>
                <button class="chip !text-xs !py-1">Phép</button>
              </div>
            </div>
            <div class="card p-3">
              <div class="flex items-center gap-2 mb-2">
                <div
                  class="avatar !w-9 !h-9 text-xs bg-gradient-to-br from-emerald-300 to-pink-300"
                >
                  P
                </div>
                <div class="flex-1 text-sm font-semibold">Phạm Nam</div>
                <i data-lucide="message-square" class="w-4 h-4 text-slate-400"></i>
              </div>
              <div class="grid grid-cols-4 gap-1">
                <button class="chip !text-xs !py-1">Có mặt</button>
                <button class="chip !text-xs !py-1">Muộn</button>
                <button class="chip active !text-xs !py-1">Vắng</button>
                <button class="chip !text-xs !py-1">Phép</button>
              </div>
            </div>
            <div class="card p-3">
              <div class="flex items-center gap-2 mb-2">
                <div class="avatar !w-9 !h-9 text-xs bg-gradient-to-br from-orange-300 to-pink-300">
                  Đ
                </div>
                <div class="flex-1 text-sm font-semibold">Đỗ Lan</div>
                <i data-lucide="message-square" class="w-4 h-4 text-slate-400"></i>
              </div>
              <div class="grid grid-cols-4 gap-1">
                <button class="chip !text-xs !py-1">Có mặt</button>
                <button class="chip !text-xs !py-1">Muộn</button>
                <button class="chip !text-xs !py-1">Vắng</button>
                <button class="chip active !text-xs !py-1">Phép</button>
              </div>
            </div>
          </div>
          <button onclick="toast('Đã lưu điểm danh')" class="btn-primary w-full mt-4">
            Lưu thay đổi (5)
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
