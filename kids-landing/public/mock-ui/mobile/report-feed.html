<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Feed báo cáo — KimThanh Kids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/mock-ui/shared.css" />
    <script src="/mock-ui/shared.js" defer></script>
  </head>
  <body class="min-h-screen">
    <div class="fixed top-4 left-4 z-50">
      <a href="/mock-ui/index.html" class="btn-soft inline-flex items-center gap-2 text-sm shadow"
        ><i data-lucide="arrow-left" class="w-4 h-4"></i>Catalog</a
      >
    </div>
    <main class="min-h-screen flex flex-col items-center justify-start py-10 px-4 bg-[#F1F5F9]">
      <div class="frame-label"><span class="num">M9</span>Feed báo cáo</div>
      <div class="phone">
        <div class="phone-body">
          <div
            class="absolute top-0 left-0 right-0 pt-9 pb-3 px-5 flex items-center justify-between bg-white border-b border-slate-100 z-10"
          >
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
            <div class="font-semibold text-slate-800">Báo cáo · Bé Minh</div>
            <div class="w-5"></div>
          </div>
          <div class="h-14"></div>
          <div class="space-y-3">
            <div class="card p-4">
              <div class="flex items-center justify-between mb-2">
                <div class="text-sm font-bold">Thứ Ba 26/05</div>
                <span class="text-xl">😊</span>
              </div>
              <div class="text-xs text-slate-500 mb-3">Cô Hà · Lớp Mầm A</div>
              <div class="text-sm space-y-1">
                <div>
                  <b class="text-slate-500 text-xs uppercase">Bữa ăn:</b> Ăn hết suất, không ăn rau
                </div>
                <div><b class="text-slate-500 text-xs uppercase">Ngủ trưa:</b> Ngủ ngon 2h</div>
                <div><b class="text-slate-500 text-xs uppercase">Hoạt động:</b> Tô màu, hát</div>
              </div>
              <div class="flex gap-2 mt-3">
                <div
                  class="w-16 h-16 rounded-lg bg-gradient-to-br from-amber-200 to-pink-200"
                ></div>
                <div
                  class="w-16 h-16 rounded-lg bg-gradient-to-br from-blue-200 to-emerald-200"
                ></div>
              </div>
            </div>
            <div class="card p-4">
              <div class="flex items-center justify-between mb-2">
                <div class="text-sm font-bold">Thứ Hai 25/05</div>
                <span class="text-xl">😐</span>
              </div>
              <div class="text-xs text-slate-500 mb-3">Cô Hà · Lớp Mầm A</div>
              <div class="text-sm space-y-1">
                <div><b class="text-slate-500 text-xs uppercase">Bữa ăn:</b> Ăn 1/2 phần</div>
                <div><b class="text-slate-500 text-xs uppercase">Ngủ trưa:</b> Khó ngủ</div>
                <div>
                  <b class="text-slate-500 text-xs uppercase">Hoạt động:</b> Vận động ngoài trời
                </div>
              </div>
              <div class="flex gap-2 mt-3">
                <div
                  class="w-16 h-16 rounded-lg bg-gradient-to-br from-amber-200 to-pink-200"
                ></div>
                <div
                  class="w-16 h-16 rounded-lg bg-gradient-to-br from-blue-200 to-emerald-200"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
