<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Splash / Bootstrap — KimThanh Kids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/mock-ui/shared.css" />
    <script src="/mock-ui/shared.js" defer></script>
  </head>
  <body class="min-h-screen">
    <div class="fixed top-4 left-4 z-50">
      <a href="/mock-ui/index.html" class="btn-soft inline-flex items-center gap-2 text-sm shadow"
        ><i data-lucide="arrow-left" class="w-4 h-4"></i>Catalog</a
      >
    </div>
    <main class="min-h-screen flex flex-col items-center justify-start py-10 px-4 bg-[#F1F5F9]">
      <div class="frame-label"><span class="num">M0</span>Splash / Bootstrap</div>
      <div class="phone">
        <div class="phone-body">
          <div
            class="absolute inset-0 brand-grad flex flex-col items-center justify-center text-white"
          >
            <img
              src="/mock-ui/logo.png"
              alt="KimThanh Kids"
              class="brand-logo-lg"
              style="height: 96px; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.25))"
            />
            <div class="text-3xl font-bold tracking-wide">KimThanh Kids</div>
            <div class="opacity-80 text-sm mt-1">Mầm non hạnh phúc</div>
            <div class="mt-10 flex gap-1">
              <span class="w-2 h-2 rounded-full bg-white/80 animate-bounce"></span
              ><span
                class="w-2 h-2 rounded-full bg-white/60 animate-bounce"
                style="animation-delay: 0.15s"
              ></span
              ><span
                class="w-2 h-2 rounded-full bg-white/40 animate-bounce"
                style="animation-delay: 0.3s"
              ></span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
