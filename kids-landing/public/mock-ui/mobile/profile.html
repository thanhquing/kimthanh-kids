<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hồ sơ — KimThanh Kids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/mock-ui/shared.css" />
    <script src="/mock-ui/shared.js" defer></script>
  </head>
  <body class="min-h-screen">
    <div class="fixed top-4 left-4 z-50">
      <a href="/mock-ui/index.html" class="btn-soft inline-flex items-center gap-2 text-sm shadow"
        ><i data-lucide="arrow-left" class="w-4 h-4"></i>Catalog</a
      >
    </div>
    <main class="min-h-screen flex flex-col items-center justify-start py-10 px-4 bg-[#F1F5F9]">
      <div class="frame-label"><span class="num">M16</span>Hồ sơ</div>
      <div class="phone">
        <div class="phone-body">
          <div
            class="absolute top-0 left-0 right-0 pt-9 pb-3 px-5 flex items-center justify-between bg-white border-b border-slate-100 z-10"
          >
            <div class="w-5"></div>
            <div class="font-semibold text-slate-800">Hồ sơ của tôi</div>
            <div class="w-5"></div>
          </div>
          <div class="h-14"></div>
          <div class="text-center">
            <div class="avatar !w-24 !h-24 mx-auto text-2xl">L</div>
            <div class="font-bold text-lg mt-3">Nguyễn Thị Lan</div>
            <div class="text-xs text-slate-500">Phụ huynh · lan.nguyen@gmail.com</div>
          </div>
          <div class="section-title">Thông tin cá nhân</div>
          <div class="card divide-y divide-slate-100">
            <div class="flex items-center gap-3 p-3">
              <i data-lucide="user" class="w-4 h-4 text-slate-400"></i>
              <div class="text-xs text-slate-500">Họ tên</div>
              <div class="ml-auto text-sm font-medium">Nguyễn Thị Lan</div>
            </div>
            <div class="flex items-center gap-3 p-3">
              <i data-lucide="phone" class="w-4 h-4 text-slate-400"></i>
              <div class="text-xs text-slate-500">SĐT</div>
              <div class="ml-auto text-sm font-medium">0912 345 678</div>
            </div>
            <div class="flex items-center gap-3 p-3">
              <i data-lucide="mail" class="w-4 h-4 text-slate-400"></i>
              <div class="text-xs text-slate-500">Email</div>
              <div class="ml-auto text-sm font-medium">lan.nguyen@gmail.com</div>
            </div>
          </div>
          <div class="section-title">Cài đặt</div>
          <div class="card divide-y divide-slate-100">
            <div class="flex items-center gap-3 p-3">
              <i data-lucide="globe" class="w-4 h-4 text-slate-400"></i>
              <div class="text-sm">Ngôn ngữ</div>
              <div class="ml-auto flex gap-1">
                <span class="chip active !text-xs !py-1">VI</span
                ><span class="chip !text-xs !py-1">EN</span>
              </div>
            </div>
            <div class="flex items-center gap-3 p-3">
              <i data-lucide="moon" class="w-4 h-4 text-slate-400"></i>
              <div class="text-sm">Giao diện tối</div>
              <div class="ml-auto w-10 h-6 bg-slate-200 rounded-full relative">
                <div class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 shadow"></div>
              </div>
            </div>
            <div class="flex items-center gap-3 p-3">
              <i data-lucide="lock" class="w-4 h-4 text-slate-400"></i>
              <div class="text-sm">Đổi mật khẩu</div>
              <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 ml-auto"></i>
            </div>
          </div>
          <button
            onclick="toast('Đã đăng xuất')"
            class="w-full mt-6 p-3 rounded-xl text-red-600 font-semibold bg-red-50"
          >
            Đăng xuất
          </button>
        </div>
        <div class="phone-tabbar">
          <div class="tab active">
            <i data-lucide="home" class="w-5 h-5"></i><span>Trang chủ</span>
          </div>
          <div class="tab"><i data-lucide="users" class="w-5 h-5"></i><span>Con tôi</span></div>
          <div class="tab"><i data-lucide="bell" class="w-5 h-5"></i><span>Thông báo</span></div>
          <div class="tab"><i data-lucide="user" class="w-5 h-5"></i><span>Hồ sơ</span></div>
        </div>
      </div>
    </main>
  </body>
</html>
