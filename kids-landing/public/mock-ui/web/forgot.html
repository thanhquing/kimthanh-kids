<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quên mật khẩu — KimThanh Web</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="/mock-ui/shared.css" />
